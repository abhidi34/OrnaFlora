# OrnaFlora Application Properties
spring.application.name=ornaflora-backend

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================
# DATABASE CONFIGURATION - PostgreSQL
# ============================================
# Using PostgreSQL for development/testing
# spring.datasource.url=jdbc:postgresql://localhost:5432/ornaflora_test
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# DATABASE CONFIGURATION - H2 (Alternative for testing without DB)
# ============================================
# Uncomment to use H2 in-memory database instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# ============================================
# DATABASE CONFIGURATION - MySQL (Alternative)
# ============================================
# Uncomment to use MySQL (comment out PostgreSQL above)
# spring.datasource.url=jdbc:mysql://localhost:3306/ornaflora?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ============================================
# JPA & HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ============================================
# FLYWAY DATABASE MIGRATION
# ============================================
spring.flyway.enabled=false

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.ornaflora=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/ornaflora.log
logging.file.max-size=10MB
logging.file.max-history=10

# ============================================
# APPLICATION CONFIGURATION
# ============================================
app.name=OrnaFlora Plant Nursery
app.version=1.0.0
app.jwt.secret=your-super-secret-key-change-in-production-at-least-32-characters
app.jwt.expiration=86400000

# ============================================
# CORS CONFIGURATION
# ============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,https://yourdomain.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
app.upload.dir=uploads/
app.upload.max-file-size=5242880
app.upload.allowed-formats=jpg,jpeg,png,gif,webp

# ============================================
# ACTUATOR CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================
# CONNECTION POOL CONFIGURATION
# ============================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true
