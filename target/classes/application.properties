# OrnaFlora Application Properties
spring.application.name=ornaflora-backend

# Active Profile (change to 'prod' for production)
spring.profiles.active=dev

# ============================================
# COMMON CONFIGURATION (applies to all environments)
# ============================================

# Server Configuration
server.port=8080

# JPA & Hibernate - Common Settings
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway
spring.flyway.enabled=false

# Application Info
app.name=OrnaFlora Plant Nursery
app.version=1.0.0

# File Upload Configuration
app.upload.dir=uploads/
app.upload.max-file-size=5242880
app.upload.allowed-formats=jpg,jpeg,png,gif,webp

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
