# ============================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ============================================

# Database - PostgreSQL (Local Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/ornaflora_new
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate - Development Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run data.sql after Hibernate creates the tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging - Development (Verbose)
logging.level.root=INFO
logging.level.com.ornaflora=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=C:/logs/ornaflora.log
logging.file.max-size=10MB
logging.file.max-history=10

# CORS - Development (Allow local frontend)
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# Security - Development (Show errors for debugging)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# JWT Configuration - Development
app.jwt.secret=OrnaFlora2026DevSecretKeyForJWTTokenGenerationAndValidation123456789
app.jwt.expiration=86400000

# Connection Pool - Development (Small pool)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.auto-commit=true
